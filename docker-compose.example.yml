version: '3.8'

services:
  api:
    build: .
    ports:
      - "${API_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DOCKER_POSTGRES_USER}:${DOCKER_POSTGRES_PASSWORD}@postgres:${DOCKER_POSTGRES_PORT}/${DOCKER_POSTGRES_DB}
      - REDIS_URL=redis://redis:${DOCKER_REDIS_PORT}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - MODEL_NAME=${MODEL_NAME}
      - MODEL_VERSION=${MODEL_VERSION}
      - MODEL_TYPE=${MODEL_TYPE}
      - MODEL_DIR=${MODEL_DIR}
    volumes:
      - ./app:/app
      - ./models:/models
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
    ports:
      - "${DOCKER_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${DOCKER_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: 